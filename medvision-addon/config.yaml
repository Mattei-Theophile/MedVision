name: MedVision Gesture Engine
version: "0.3.0"
slug: medvision
description: Commande domotique par gestes (caméra ou radar mmWave), 100 % locale, aucune vidéo stockée.
url: https://github.com/Mattei-Theophile/MedVision
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
# Interface d'enregistrement des gestes dans la barre latérale (authentification par HA).
ingress: true
ingress_port: 8099
panel_icon: mdi:hand-wave
panel_title: MedVision
# Accès aux webcams USB (/dev/video*) et aux ports série (/dev/ttyUSB*, /dev/ttyACM*) du radar.
video: true
uart: true
# Les gestes sont rangés dans /share/medvision/gestures.
map:
  - type: share
    read_only: false
# Récupère automatiquement les identifiants de l'add-on Mosquitto.
services:
  - mqtt:want
options:
  sensor_type: camera
  camera_source: "0"
  radar_port: /dev/ttyUSB0
  fps: 15
  device_id: salon
  device_name: MedVision Salon
  attention_gesture: ""
  armed_timeout: 5
  cooldown: 1.5
  motion_gating: true
  mqtt_host: auto
  log_level: INFO
schema:
  sensor_type: list(camera|ld2450|simulation)
  camera_source: str
  radar_port: str
  radar_baudrate: int?
  radar_max_distance: float(0.5,6)?
  radar_anchor_time: float(0.5,10)?
  fps: int(1,30)
  device_id: match(^[a-z0-9_]+$)
  device_name: str
  attention_gesture: str?
  armed_timeout: float(1,30)
  cooldown: float(0,10)
  motion_gating: bool
  mqtt_host: str
  mqtt_port: port?
  mqtt_username: medvision
  mqtt_password: medvision
  default_threshold: float(0.05,2)?
  window_frames: int(5,60)?
  num_hands: int(1,2)?
  rest_gestures: str?
  log_level: list(DEBUG|INFO|WARNING|ERROR)
